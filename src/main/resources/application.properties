spring.application.name=Loja
server.port=8081
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
app.gerente-inicial.email=${GERENTE_EMAIL}
app.gerente-inicial.senha=${GERENTE_SENHA}
spring.datasource.url=jdbc:postgresql://localhost:5432/Lojadb
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}